mcp_servers:
  crawl4ai:
    command: pwsh
    args:
      - -NoLogo
      - -NoProfile
      - -NonInteractive
      - -Command
      - "$fleet = Get-Content (Join-Path $env:USERPROFILE '.agents/skills/.agent-signal-fleet.json') -Raw | ConvertFrom-Json; $root = Split-Path -Parent (Split-Path -Parent $fleet.source_snapshot); & (Join-Path $env:USERPROFILE '.local/share/crawl4ai-recovery/venv/Scripts/python.exe') -B (Join-Path $root 'integrations/crawl4ai/server.py')"
    enabled: true
    timeout: 150
    connect_timeout: 45
    tools:
      include: [scrape, search, serp, answer, extract, batch, balance, estimate, jobs_submit, jobs_status, jobs_results]
